<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
  </head>
  <body>
    <!-- The adapter's landmarks (src/adapter/page-state.ts), with synthetic chats. -->
    <div id="app" data-testid="fake-whatsapp">
      Fake WhatsApp for automated tests
      <div id="pane-side" aria-label="Chat list">
        <div role="row">Test Chat One</div>
        <div role="row">Test Chat Two</div>
      </div>
    </div>
    <nav>
      <a
        data-testid="link-new-tab"
        href="https://example.com/article?id=7#top"
        target="_blank"
        rel="noopener noreferrer"
        >New tab</a
      >
      <a data-testid="link-same-tab" href="https://example.com/same-tab">Same tab</a>
      <a data-testid="link-mailto" href="mailto:someone@example.com?subject=Hi there">Mail</a>
      <a data-testid="link-tel" href="tel:+44 7700 900123">Call</a>
      <a data-testid="link-file" href="file:///etc/passwd" target="_blank">File</a>
      <a data-testid="link-deep" href="whatsapp://send?phone=447700900123">Chat</a>
      <button data-testid="popup-then-navigate" type="button">Popup that navigates</button>
      <button data-testid="popup-blank" type="button">Popup that stays blank</button>
    </nav>
    <button data-testid="share-screen" type="button">Share screen</button>
    <output data-testid="share-result"></output>
    <button data-testid="share-keep" type="button">Share and keep sharing</button>
    <button data-testid="share-stop" type="button">Stop sharing</button>
    <output data-testid="share-status"></output>
    <div id="main">
      <header>Test Chat One</header>
      <footer>
        <div data-testid="composer" contenteditable="true" aria-label="Type a message"></div>
      </footer>
    </div>
    <output data-testid="paste-result"></output>
    <button data-testid="notify" type="button">Notify</button>
    <button data-testid="notify-read" type="button">Read the chat</button>
    <output data-testid="notify-result"></output>
    <button data-testid="call" type="button">Call</button>
    <button data-testid="call-blank" type="button">Call through a blank window</button>
    <script src="/links.js"></script>
    <script src="/share.js"></script>
    <script src="/paste.js"></script>
    <script src="/notify.js"></script>
    <script src="/call.js"></script>
  </body>
</html>
