<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
    <style>
      /* As WhatsApp lays out the open chat: a flex column ordered with
         \`order\`, under a wallpaper that covers it, with the messages and the
         message box raised above it (#466). */
      #main {
        position: relative;
        display: flex;
        flex-direction: column;
      }
      #main > [data-testid='wallpaper'] {
        position: absolute;
        inset: 0;
      }
      #main > header {
        position: relative;
        z-index: 1000;
      }
      #main > [role='row'] {
        order: 2;
        position: relative;
        z-index: 1;
      }
      #main > footer {
        order: 3;
        position: relative;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <!-- The adapter's landmarks (src/adapter/page-state.ts), with synthetic chats. -->
    <div id="app" data-testid="fake-whatsapp">
      Fake WhatsApp for automated tests
      <!-- As WhatsApp lays out the chat list (#100): only an unread chat has
           a badge, whose text is the count alone. -->
      <div id="pane-side" aria-label="Chat list">
        <div role="row" data-testid="list-item-0">
          <div data-testid="cell-frame-title"><span dir="auto">Test Chat One</span></div>
          <span data-testid="chat-list-timestamp">20:01</span>
          <div data-testid="cell-frame-secondary"><span dir="ltr">See you at 8</span></div>
        </div>
        <div role="row" data-testid="list-item-1">
          <div data-testid="cell-frame-title"><span dir="auto">Test Chat Two</span></div>
          <span data-testid="chat-list-timestamp">21:15</span>
          <div data-testid="cell-frame-secondary">
            <span dir="ltr">Are you coming tomorrow?</span>
            <span data-testid="icon-unread-count">2</span>
          </div>
        </div>
      </div>
      <header data-testid="chatlist-header">
        <div data-testid="navbar-footer-section">
          <button data-navbar-item="true" type="button" aria-label="Profile">
            <img data-testid="own-avatar" src="/media/avatar.png" alt="" width="24" height="24" />
          </button>
        </div>
      </header>
    </div>
    <nav>
      <a
        data-testid="link-new-tab"
        href="https://example.com/article?id=7#top"
        target="_blank"
        rel="noopener noreferrer"
        >New tab</a
      >
      <a data-testid="link-same-tab" href="https://example.com/same-tab">Same tab</a>
      <a data-testid="link-mailto" href="mailto:someone@example.com?subject=Hi there">Mail</a>
      <a data-testid="link-tel" href="tel:+44 7700 900123">Call</a>
      <a data-testid="link-file" href="file:///etc/passwd" target="_blank">File</a>
      <a data-testid="link-deep" href="whatsapp://send?phone=447700900123">Chat</a>
      <button data-testid="popup-then-navigate" type="button">Popup that navigates</button>
      <button data-testid="popup-blank" type="button">Popup that stays blank</button>
    </nav>
    <button data-testid="share-screen" type="button">Share screen</button>
    <output data-testid="share-result"></output>
    <button data-testid="share-keep" type="button">Share and keep sharing</button>
    <button data-testid="share-stop" type="button">Stop sharing</button>
    <output data-testid="share-status"></output>
    <div id="main">
      <div data-testid="wallpaper"></div>
      <header><span dir="auto">Test Chat One</span></header>
      <!-- As WhatsApp marks messages today: a bare ID, and only the account's
           own messages with a tail and a clickable delivery status (#410). -->
      <div role="row" data-testid="message">
        <div data-testid="conv-msg-3EB0F1" data-id="3EB0F1">
          <div data-pre-plain-text="[19:58, 24/10/2026] Test Chat One: ">
            <span data-testid="selectable-text">Dinner tonight?</span>
            <span aria-hidden="true">19:58</span>
          </div>
          <div data-testid="msg-meta"><span>19:58</span></div>
        </div>
      </div>
      <div role="row">
        <div data-testid="conv-msg-3EB0F2" data-id="3EB0F2">
          <span data-testid="tail-out"></span>
          <div data-pre-plain-text="[20:01, 24/10/2026] You: ">
            <span data-testid="selectable-text">See you at 8</span>
            <span aria-hidden="true">20:01</span>
          </div>
          <div data-testid="msg-meta" role="button"><span>20:01</span></div>
        </div>
      </div>
      <footer>
        <div data-testid="composer" contenteditable="true" aria-label="Type a message"></div>
      </footer>
    </div>
    <output data-testid="paste-result"></output>
    <button data-testid="notify" type="button">Notify</button>
    <button data-testid="notify-read" type="button">Read the chat</button>
    <output data-testid="notify-result"></output>
    <button data-testid="call" type="button">Call</button>
    <button data-testid="call-blank" type="button">Call through a blank window</button>
    <script src="/links.js"></script>
    <script src="/share.js"></script>
    <script src="/paste.js"></script>
    <script src="/compose.js"></script>
    <script src="/notify.js"></script>
    <script src="/call.js"></script>
  </body>
</html>
