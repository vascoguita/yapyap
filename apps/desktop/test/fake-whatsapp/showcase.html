<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
    <link rel="stylesheet" href="/showcase.css" />
  </head>
  <body>
    <!-- A demo chat page with invented people, for the website's screenshots (#384). It
         carries the landmarks the adapter reads, so YapYap treats it as a logged-in account. -->
    <div id="app" data-testid="fake-whatsapp">
      <nav class="rail" aria-label="Navigation">
        <span class="rail-icon active" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z" /></svg>
        </span>
        <span class="rail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /></svg>
        </span>
        <span class="rail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5,19c1,-4 4,-6 7,-6s6,2 7,6M12,11a3,3 0,1,0 0,-6 3,3 0,0,0 0,6" />
          </svg>
        </span>
        <div class="rail-foot" data-testid="navbar-footer-section">
          <button type="button" data-navbar-item="true" aria-label="Profile">
            <img id="own-avatar" alt="" src="/media/showcase/personal.png" />
          </button>
        </div>
      </nav>
      <aside class="list">
        <header class="list-head">
          <h1>Chats</h1>
          <div class="search">Search or start a new chat</div>
          <div class="filters">
            <span class="chip on">All</span><span class="chip">Unread</span
            ><span class="chip">Groups</span>
          </div>
        </header>
        <div id="pane-side" role="grid" aria-label="Chat list"></div>
      </aside>
      <main id="main">
        <header class="chat-head">
          <span class="face" id="chat-face"></span>
          <div>
            <span dir="auto" id="chat-name"></span>
            <small id="chat-status"></small>
          </div>
        </header>
        <section class="messages" id="messages"></section>
        <footer>
          <div
            class="composer"
            contenteditable="true"
            data-testid="composer"
            aria-label="Type a message"
          ></div>
        </footer>
      </main>
    </div>
    <script src="/showcase.js"></script>
  </body>
</html>
