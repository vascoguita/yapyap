<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
    <link rel="stylesheet" href="/showcase.css" />
  </head>
  <body>
    <!-- A demo chat page with invented people, for the README's and website's pictures
         (#384, #663). It looks like today's WhatsApp Web and carries the landmarks the
         adapter reads, so YapYap treats it as a logged-in account. -->
    <div id="app" data-testid="fake-whatsapp">
      <nav class="rail" aria-label="Navigation">
        <span class="rail-icon active" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="filled">
            <path
              d="M5,4h14a2,2,0,0,1,2,2v9a2,2,0,0,1,-2,2H9l-4,3.5V17a2,2,0,0,1,-2,-2V6a2,2,0,0,1,2,-2zm3,5h8M8,12.5h5"
            />
          </svg>
        </span>
        <span class="rail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M6.6,3.5h3l1.5,4,-2,1.3a10,10,0,0,0,5.1,5.1l1.3,-2,4,1.5v3a2,2,0,0,1,-2.2,2A16,16,0,0,1,4.6,5.7a2,2,0,0,1,2,-2.2z"
            />
          </svg>
        </span>
        <span class="rail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" stroke-dasharray="11 2.4" />
            <circle cx="12" cy="12" r="5" />
          </svg>
        </span>
        <span class="rail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12,3.5a8.5,8.5,0,0,1,0,17c-1.5,0,-3-.4,-4.2,-1.1L3.5,20.5l1.2,-4.1A8.5,8.5,0,0,1,12,3.5zM8.5,12h.01M12,12h.01M15.5,12h.01"
            />
          </svg>
        </span>
        <span class="rail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12,11a3,3,0,1,0,0,-6,3,3,0,0,0,0,6zM6,12a2.3,2.3,0,1,0,0,-4.6A2.3,2.3,0,0,0,6,12zm12,0a2.3,2.3,0,1,0,0,-4.6,2.3,2.3,0,0,0,0,4.6zM7,18.5c.6,-3,2.6,-5,5,-5s4.4,2,5,5zM2.5,17.5c.4,-2,1.7,-3.4,3.5,-3.6M21.5,17.5c-.4,-2,-1.7,-3.4,-3.5,-3.6"
            />
          </svg>
        </span>
        <div class="rail-foot" data-testid="navbar-footer-section">
          <span class="rail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12,3.5l1.6,2.3,2.8-.5.6,2.8,2.4,1.5,-1.2,2.4,1.2,2.4,-2.4,1.5-.6,2.8,-2.8-.5L12,20.5l-1.6,-2.3,-2.8.5-.6,-2.8,-2.4,-1.5,1.2,-2.4L4.6,9.6,7,8.1l.6,-2.8,2.8.5z"
              />
            </svg>
          </span>
          <button type="button" data-navbar-item="true" aria-label="Profile">
            <img id="own-avatar" alt="" src="/media/showcase/personal.png" />
          </button>
        </div>
      </nav>
      <aside class="list">
        <header class="list-head">
          <div class="list-title">
            <h1>WhatsApp</h1>
            <span class="head-icons" aria-hidden="true">
              <span class="new-chat">
                <svg viewBox="0 0 24 24"><path d="M12,6v12M6,12h12" /></svg>
              </span>
              <svg viewBox="0 0 24 24" class="dots">
                <path d="M12,5.5h.01M12,12h.01M12,18.5h.01" />
              </svg>
            </span>
          </div>
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6" />
              <path d="M15,15l5,5" />
            </svg>
            Search or start a new chat
          </div>
          <div class="filters">
            <span class="chip on">All</span><span class="chip">Unread</span
            ><span class="chip">Favourites</span><span class="chip">Groups</span
            ><span class="chip add" aria-hidden="true">+</span>
          </div>
        </header>
        <div id="pane-side" role="grid" aria-label="Chat list"></div>
      </aside>
      <main id="main">
        <header class="chat-head">
          <span class="face" id="chat-face"></span>
          <div class="chat-title">
            <span dir="auto" id="chat-name"></span>
            <small id="chat-status"></small>
          </div>
          <span class="head-icons" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="7" width="12.5" height="10" rx="2" />
              <path d="M15.5,10.5l5,-3v9l-5,-3z" />
            </svg>
            <svg viewBox="0 0 24 24">
              <path
                d="M6.6,3.5h3l1.5,4,-2,1.3a10,10,0,0,0,5.1,5.1l1.3,-2,4,1.5v3a2,2,0,0,1,-2.2,2A16,16,0,0,1,4.6,5.7a2,2,0,0,1,2,-2.2z"
              />
            </svg>
            <svg viewBox="0 0 24 24">
              <circle cx="10.5" cy="10.5" r="6" />
              <path d="M15,15l5,5" />
            </svg>
            <svg viewBox="0 0 24 24" class="dots">
              <path d="M12,5.5h.01M12,12h.01M12,18.5h.01" />
            </svg>
          </span>
        </header>
        <section class="messages" id="messages"></section>
        <footer>
          <!-- WhatsApp's row: attach, emoji, the field in a box of its own, then the
               microphone, which Send takes the place of, so the AI Assistant's rewrite
               button has its place (#609). -->
          <div class="compose-row">
            <button type="button" class="compose-icon" aria-label="Attach">
              <svg viewBox="0 0 24 24"><path d="M12,5v14M5,12h14" /></svg>
            </button>
            <button type="button" class="compose-icon" aria-label="Emoji">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8.5" />
                <path d="M8.5,14.5c.9,1.3,2.1,2,3.5,2s2.6-.7,3.5,-2M9,10h.01M15,10h.01" />
              </svg>
            </button>
            <div class="compose-field">
              <div
                class="composer"
                contenteditable="true"
                data-testid="composer"
                aria-label="Type a message"
              ></div>
            </div>
            <button
              type="button"
              class="compose-icon"
              id="voice-or-send"
              aria-label="Voice message"
            >
              <svg viewBox="0 0 24 24">
                <path
                  class="voice"
                  d="M12,4a3,3,0,0,1,3,3v5a3,3,0,0,1,-6,0V7a3,3,0,0,1,3,-3zM6,11a6,6,0,0,0,12,0M12,17v3"
                />
                <path class="send" d="M5,12l14,-7,-4.5,15,-3,-6z" />
              </svg>
            </button>
          </div>
        </footer>
      </main>
    </div>
    <script src="/showcase.js"></script>
  </body>
</html>
