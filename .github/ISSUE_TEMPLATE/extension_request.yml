name: Extension request
description: Propose an extension, or a new extension capability.
labels: ['area: extensions', 'status: needs-triage']
body:
  - type: textarea
    id: idea
    attributes:
      label: Extension idea
      description: What would the extension do for you?
    validations:
      required: true
  - type: checkboxes
    id: capabilities
    attributes:
      label: Capabilities it would need
      description: Extensions get only what they declare and the user approves.
      options:
        - label: Read the active chat (last N messages)
        - label: Read unread-message summaries
        - label: Insert a draft into the composer
        - label: Show notifications
        - label: Local storage
        - label: Store secrets (e.g. API keys)
        - label: Network access to specific hosts
  - type: input
    id: hosts
    attributes:
      label: Network hosts
      placeholder: e.g. api.example.com
  - type: textarea
    id: new-capability
    attributes:
      label: Missing capability
      description: If the extension needs something no capability provides, describe it and why it is safe.
