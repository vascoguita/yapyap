name: Bug report
description: Something in YapYap does not work as expected.
labels: ['type: bug', 'status: needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please never paste message content, phone numbers or screenshots that show private conversations.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Package format
      options:
        - Flatpak
        - AppImage
        - DEB
        - RPM
        - AUR
        - Windows installer
        - Windows portable
        - macOS DMG
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and desktop
      placeholder: e.g. Fedora 44, GNOME 50, Wayland
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of Help → Copy diagnostics. It is redacted automatically.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any private information from this report.
          required: true
