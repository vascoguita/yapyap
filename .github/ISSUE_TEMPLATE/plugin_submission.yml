name: Plugin submission
description: Ask for your plugin to be reviewed and listed in the YapYap marketplace.
title: 'Plugin submission: '
labels: ['area: plugins', 'marketplace: submission', 'status: needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building a YapYap plugin. Please read [how a plugin is listed](https://yapyap.guita.org/plugins/marketplace) first. The maintainer reviews the exact archive you link below, so ship readable JavaScript: no minified or obfuscated code.
  - type: input
    id: id
    attributes:
      label: Plugin ID
      placeholder: org.example.translate
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One or two sentences for the marketplace, at most 300 characters.
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Source repository
      placeholder: https://github.com/example/translate
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Tag of this version's source
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: archive
    attributes:
      label: Archive URL
      description: The signed `.yapyap-plugin` file, as a release asset of your repository.
      placeholder: https://github.com/example/translate/releases/download/v1.0.0/org.example.translate-1.0.0.yapyap-plugin
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: Archive SHA-256
      description: 'Run: openssl dgst -sha256 -binary <file> | base64, and write it as sha256-<result>.'
      placeholder: sha256-…
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Signing key fingerprint
      description: As `yapyap-plugin-sign verify` prints it. Every version must be signed by this key.
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage
      placeholder: https://example.org/translate
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License (SPDX)
      placeholder: MIT
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Why it needs each capability and host
      description: List every capability and network host in your manifest, and what the plugin does with it.
    validations:
      required: true
  - type: input
    id: privacy
    attributes:
      label: Privacy policy
      description: Where users can read what the plugin, and any server it talks to, does with their data. Required if it connects anywhere.
  - type: checkboxes
    id: terms
    attributes:
      label: Before you submit
      options:
        - label: The archive is exactly the one built from the tag above, and its code is not minified or obfuscated.
          required: true
        - label: The plugin collects nothing it does not need, and sends nothing anywhere the user was not told about.
          required: true
        - label: I understand that a listed plugin can be pulled from the marketplace if it misbehaves.
          required: true
