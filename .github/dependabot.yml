version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: ['type: dependencies']
    commit-message:
      prefix: build
      include: scope

  # Wrangler, which uploads packages.guita.org, kept apart from the workspace.
  - package-ecosystem: npm
    directory: /packaging/repository/deploy
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    versioning-strategy: increase
    labels: ['type: dependencies']
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: github-actions
    # The root covers the workflows; local composite actions pin actions too.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    labels: ['type: dependencies']
    commit-message:
      prefix: ci
      include: scope
