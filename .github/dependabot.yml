version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: ['type: dependencies']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    labels: ['type: dependencies']
    commit-message:
      prefix: ci
      include: scope
