name: Distribute

# Brings a published release or beta to Homebrew (#346), Scoop and winget
# (#345). Each needs a repository or token only the maintainer can create;
# until it exists, its job skips with a notice instead of failing (see
# CONTRIBUTING). Installs always download from the GitHub release itself.
on:
  workflow_call:
    inputs:
      tag:
        description: The published release, such as v0.1.0 or v0.1.0-beta.1
        type: string
        required: true
    # Only the tokens this workflow uses, rather than every secret.
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
      SCOOP_BUCKET_TOKEN:
        required: false
      WINGET_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  manifests:
    name: Generate the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checksums come from the release's own SHA256SUMS, which publish.yml
      # wrote from the files it attached, so no installer is downloaded here.
      # The winget and Scoop manifests are checked against their schemas first.
      - name: Generate them from the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          node scripts/src/bin/distribution.ts "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/manifests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-manifests
          path: ${{ runner.temp }}/manifests
          retention-days: 7

  repository:
    name: Update ${{ matrix.repository }}
    needs: manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: homebrew
            repository: vascoguita/homebrew-yapyap
            secret: HOMEBREW_TAP_TOKEN
            folder: Casks
          - channel: scoop
            repository: vascoguita/scoop-yapyap
            secret: SCOOP_BUCKET_TOKEN
            folder: bucket
    steps:
      # Each secret is named rather than looked up by the matrix value, so the
      # runner receives only these two, never every repository secret.
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ matrix.channel == 'homebrew' && secrets.HOMEBREW_TAP_TOKEN || matrix.channel == 'scoop' && secrets.SCOOP_BUCKET_TOKEN || '' }}
          SECRET: ${{ matrix.secret }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SECRET is missing: the manifests are not published to $REPOSITORY (see CONTRIBUTING)."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: distribution-manifests
          path: manifests
      # A fine-grained token limited to this one repository, kept for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: ${{ matrix.repository }}
          token: ${{ matrix.channel == 'homebrew' && secrets.HOMEBREW_TAP_TOKEN || matrix.channel == 'scoop' && secrets.SCOOP_BUCKET_TOKEN || '' }}
          path: target
      - name: Commit and push them
        if: steps.token.outputs.present == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          FOLDER: ${{ matrix.folder }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "target/$FOLDER"
          cp "manifests/$CHANNEL/$FOLDER/"* "target/$FOLDER/"
          cd target
          git add "$FOLDER"
          if git diff --cached --quiet; then
            echo "The manifests already describe ${TAG#v}."
            exit 0
          fi
          git -c user.name='Vasco Guita' -c user.email='vascoguita@users.noreply.github.com' \
            commit -m "Update to ${TAG#v}"
          git push origin HEAD

  winget:
    name: Propose to winget
    needs: manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WINGET_TOKEN is missing: no pull request is opened in microsoft/winget-pkgs (see CONTRIBUTING)."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: distribution-manifests
          path: manifests
      # Komac submits manifests it did not write, from a Linux runner, which
      # wingetcreate cannot; the archive is checked against the checksum its
      # v2.17.1 release lists.
      - name: Install Komac
        if: steps.token.outputs.present == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/komac.tar.gz" \
            https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz
          echo "e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7  $RUNNER_TEMP/komac.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac
      # Komac forks winget-pkgs under the token's owner and opens one pull
      # request per package. It skips manifests it cannot read without
      # failing, so its output is checked.
      - name: Open the winget-pkgs pull requests
        if: steps.token.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          for package in manifests/winget/*/; do
            output=$("$RUNNER_TEMP/komac" submit --yes "$package" 2>&1) || { echo "$output"; exit 1; }
            echo "$output"
            if grep -q 'No valid packages' <<< "$output"; then
              echo "::error::Komac could not read the manifests in $package."
              exit 1
            fi
          done
