name: Distribute

# Brings a published release or beta to Homebrew (#346), Scoop and winget
# (#345). Scoop and winget each need a token only the maintainer can create,
# and Homebrew the automation App; until they exist, their job skips with a
# notice instead of failing (see CONTRIBUTING). Installs always download from
# the GitHub release itself.
on:
  workflow_call:
    inputs:
      tag:
        description: The published release, such as v0.1.0 or v0.1.0-beta.1
        type: string
        required: true
    # Only the tokens this workflow uses, rather than every secret.
    secrets:
      AUTOMATION_APP_PRIVATE_KEY:
        required: false
      SCOOP_BUCKET_TOKEN:
        required: false
      WINGET_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  manifests:
    name: Generate the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checksums come from the release's own SHA256SUMS, which publish.yml
      # wrote from the files it attached, so no installer is downloaded here.
      # The winget and Scoop manifests are checked against their schemas first.
      - name: Generate them from the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          node scripts/src/bin/distribution.ts "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/manifests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-manifests
          path: ${{ runner.temp }}/manifests
          retention-days: 7

  homebrew:
    name: Propose to vascoguita/homebrew-yapyap
    needs: manifests
    runs-on: ubuntu-latest
    steps:
      # The tap's master takes changes only through pull requests that pass
      # its checks, so the automation App, installed on the tap, opens one.
      - name: Mint the automation token
        id: app-token
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: homebrew-yapyap
          permission-contents: write
          permission-pull-requests: write
      - name: Say why nothing is proposed
        if: steps.app-token.outputs.token == ''
        run: echo "::notice::The automation App is not configured, so the casks are not proposed to vascoguita/homebrew-yapyap (see CONTRIBUTING)."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.app-token.outputs.token != ''
        with:
          name: distribution-manifests
          path: manifests
      - name: Find the casks that change
        id: casks
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAP: vascoguita/homebrew-yapyap
        run: |
          changes='[]'
          for file in manifests/homebrew/Casks/*.rb; do
            path="Casks/$(basename "$file")"
            current=$(gh api "repos/$TAP/contents/$path?ref=master" -H 'Accept: application/vnd.github.raw' 2> /dev/null || true)
            if [ "$current" != "$(cat "$file")" ]; then
              changes=$(jq -c --arg path "$path" --arg contents "$(base64 -w0 "$file")" \
                '. + [{path: $path, contents: $contents}]' <<< "$changes")
            fi
          done
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
      - name: Open the pull request and let it merge once its checks pass
        if: steps.casks.outputs.changes != '' && steps.casks.outputs.changes != '[]'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAP: vascoguita/homebrew-yapyap
          TAG: ${{ inputs.tag }}
          CHANGES: ${{ steps.casks.outputs.changes }}
        run: |
          version=${TAG#v}
          branch="update/$version"
          title="chore: update YapYap to $version"
          base=$(gh api "repos/$TAP/git/ref/heads/master" --jq .object.sha)
          # A branch left by an earlier run of this release starts again from master.
          gh api -X DELETE "repos/$TAP/git/refs/heads/$branch" 2> /dev/null || true
          gh api "repos/$TAP/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base" > /dev/null
          # GitHub signs commits made through its API, as the tap's master requires.
          jq -n --arg tap "$TAP" --arg branch "$branch" --arg base "$base" --arg title "$title" \
            --argjson additions "$CHANGES" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $tap, branchName: $branch},
                expectedHeadOid: $base,
                message: {headline: $title},
                fileChanges: {additions: $additions}
              }}
            }' | gh api graphql --input - > /dev/null
          url=$(gh pr create --repo "$TAP" --base master --head "$branch" --title "$title" \
            --body "Written by YapYap's release workflow from the checksums of [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG). It merges once the checks pass.")
          gh pr merge --repo "$TAP" --auto --merge "$url"

  scoop:
    name: Update vascoguita/scoop-yapyap
    needs: manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -n "$SCOOP_BUCKET_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SCOOP_BUCKET_TOKEN is missing: the manifests are not published to vascoguita/scoop-yapyap (see CONTRIBUTING)."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: distribution-manifests
          path: manifests
      # A fine-grained token limited to this one repository, kept for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: vascoguita/scoop-yapyap
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: target
      - name: Commit and push them
        if: steps.token.outputs.present == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p target/bucket
          cp manifests/scoop/bucket/* target/bucket/
          cd target
          git add bucket
          if git diff --cached --quiet; then
            echo "The manifests already describe ${TAG#v}."
            exit 0
          fi
          git -c user.name='Vasco Guita' -c user.email='vascoguita@users.noreply.github.com' \
            commit -m "Update to ${TAG#v}"
          git push origin HEAD

  winget:
    name: Propose to winget
    needs: manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WINGET_TOKEN is missing: no pull request is opened in microsoft/winget-pkgs (see CONTRIBUTING)."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: distribution-manifests
          path: manifests
      # Komac submits manifests it did not write, from a Linux runner, which
      # wingetcreate cannot; the archive is checked against the checksum its
      # v2.17.1 release lists.
      - name: Install Komac
        if: steps.token.outputs.present == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/komac.tar.gz" \
            https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz
          echo "e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7  $RUNNER_TEMP/komac.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac
      # Komac forks winget-pkgs under the token's owner and opens one pull
      # request per package. It skips manifests it cannot read without
      # failing, so its output is checked.
      - name: Open the winget-pkgs pull requests
        if: steps.token.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          for package in manifests/winget/*/; do
            output=$("$RUNNER_TEMP/komac" submit --yes "$package" 2>&1) || { echo "$output"; exit 1; }
            echo "$output"
            if grep -q 'No valid packages' <<< "$output"; then
              echo "::error::Komac could not read the manifests in $package."
              exit 1
            fi
          done
