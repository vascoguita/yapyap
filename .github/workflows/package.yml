name: Package

on:
  workflow_call:
    inputs:
      scope:
        description: full runs every format and architecture; representative, one package per system (ADR 0007)
        type: string
        default: full
      release:
        description: Stamp the release into the metainfo and sign with the certificates that exist
        type: boolean
        default: false
      version:
        description: Package this version instead of the one in apps/desktop/package.json (betas)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env: &package-env
      # Never sign with whatever identity happens to be on the runner; release
      # builds sign only with the certificates passed in below.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps: &package-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm appstream desktop-file-utils
      - run: pnpm install --frozen-lockfile
      - &use-version
        name: Use the version being released
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        # electron-builder, the Flatpak build and the metainfo stamp all read it from here.
        run: |
          node -e "const fs = require('node:fs'); const file = 'apps/desktop/package.json';
            const desktop = JSON.parse(fs.readFileSync(file, 'utf8'));
            desktop.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(desktop, null, 2) + '\n');"
      - name: Stamp the release into the AppStream metainfo
        if: inputs.release
        run: node scripts/src/bin/stamp-metainfo.ts
      - name: Validate desktop entry and AppStream metainfo
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/org.guita.YapYap.desktop
          appstreamcli validate --no-net packaging/linux/org.guita.YapYap.metainfo.xml
      - name: Configure code signing
        # electron-builder skips signing on pull requests but treats any defined
        # CSC_LINK, even an empty one, as a certificate path on other events, so
        # signing variables are exported only when a release has the secret.
        if: inputs.release
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          export_if_set() {
            [ -n "$2" ] || return 1
            { echo "$1<<YAPYAP_SECRET"; echo "$2"; echo "YAPYAP_SECRET"; } >> "$GITHUB_ENV"
          }
          if [ "$RUNNER_OS" = macOS ]; then
            # electron-builder falls back to CSC_LINK on Windows, so the macOS
            # certificate is only exported on macOS.
            export_if_set CSC_LINK "$MAC_CSC_LINK" && export_if_set CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD" ||
              echo "::notice::macOS signing secrets are missing: the DMG is unsigned and does not self-update (see CONTRIBUTING)."
            # An App Store Connect API key notarizes without an Apple ID and its
            # two-factor sign-in (#400); electron-builder reads it from a file.
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              key="$RUNNER_TEMP/apple-api-key.p8"
              (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
              export_if_set APPLE_API_KEY "$key" && export_if_set APPLE_API_KEY_ID "$APPLE_API_KEY_ID" &&
                export_if_set APPLE_API_ISSUER "$APPLE_API_ISSUER"
            else
              export_if_set APPLE_ID "$APPLE_ID" && export_if_set APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD" &&
                export_if_set APPLE_TEAM_ID "$APPLE_TEAM_ID" ||
                echo "::notice::Apple notarization secrets are missing: the app is not notarized (see CONTRIBUTING)."
            fi
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            export_if_set WIN_CSC_LINK "$WIN_CSC_LINK" && export_if_set WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD" ||
              echo "::notice::Windows signing secrets are missing: installers are unsigned (see CONTRIBUTING)."
          fi
      - run: pnpm package
      - name: Verify fuses (Linux)
        if: runner.os == 'Linux'
        run: node scripts/src/bin/verify-fuses.ts apps/desktop/release/linux*-unpacked/yapyap
      - name: Verify fuses (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/src/bin/verify-fuses.ts apps/desktop/release/win*-unpacked/YapYap.exe
      - name: Verify fuses (macOS)
        if: runner.os == 'macOS'
        run: node scripts/src/bin/verify-fuses.ts apps/desktop/release/mac-universal/YapYap.app
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          retention-days: 7

  package-full:
    name: Package (${{ matrix.name }})
    if: inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env: *package-env
    steps: *package-steps

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    if: inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - *use-version
      - name: Stamp the release into the AppStream metainfo
        if: inputs.release
        run: node scripts/src/bin/stamp-metainfo.ts
      - name: Build the unpacked app for Flatpak
        run: |
          pnpm --filter @yapyap/desktop build
          pnpm --filter @yapyap/desktop run builder --linux dir --publish never -c.extraMetadata.installChannel=flatpak
          if [ -d apps/desktop/release/linux-arm64-unpacked ]; then mv apps/desktop/release/linux-arm64-unpacked apps/desktop/release/linux-unpacked; fi
      - name: Lint the manifest
        run: flatpak-builder-lint manifest packaging/flatpak/org.guita.YapYap.yml
      - name: Build the bundle
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --state-dir="$RUNNER_TEMP/flatpak-state" --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/build" \
            packaging/flatpak/org.guita.YapYap.yml
          flatpak build-bundle "$RUNNER_TEMP/repo" "yapyap-$ARCH.flatpak" org.guita.YapYap \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
        env:
          ARCH: ${{ matrix.arch }}
      - name: Lint the build with Flathub's rules
        run: |
          flatpak-builder-lint --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json \
            repo "$RUNNER_TEMP/repo"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-flatpak-${{ matrix.arch }}
          path: yapyap-${{ matrix.arch }}.flatpak
          retention-days: 7

  plugins:
    name: First-party plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the plugins
        run: pnpm --filter "./plugins/**" build
      # Only YapYap's key may sign plugins under its own ID (ADR 0004). The key
      # reaches only a file readable by this job's user, which is removed as
      # soon as the plugins are signed; it is never printed.
      - name: Sign and pack the first-party plugins
        if: inputs.release
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: node scripts/src/bin/sign-plugins.ts
      - name: Upload the signed plugins
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-plugins
          path: plugins-out/*.yapyap-plugin
          if-no-files-found: error
          retention-days: 7
