name: Package smoke tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Smoke (${{ matrix.format }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, arch: x64, os: ubuntu-latest, artifact: packages-linux-x64 }
          - { format: appimage, arch: x64, os: ubuntu-latest, artifact: packages-linux-x64 }
          - { format: deb, arch: arm64, os: ubuntu-24.04-arm, artifact: packages-linux-arm64 }
          - { format: appimage, arch: arm64, os: ubuntu-24.04-arm, artifact: packages-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: packages
      - name: Install DEB
        if: matrix.format == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./packages/*.deb
          echo "YAPYAP_PACKAGED_EXECUTABLE=/opt/YapYap/yapyap" >> "$GITHUB_ENV"
      - name: Prepare AppImage
        if: matrix.format == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64
          # AppImages cannot ship a setuid sandbox helper, so Chromium needs
          # unprivileged user namespaces, which Ubuntu restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          chmod +x packages/*.AppImage
          echo "YAPYAP_PACKAGED_EXECUTABLE=$(ls "$PWD"/packages/*.AppImage)" >> "$GITHUB_ENV"
      - run: xvfb-run -a pnpm test:smoke

  rpm:
    name: Smoke (rpm-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-latest, artifact: packages-linux-x64 }
          - { arch: arm64, os: ubuntu-24.04-arm, artifact: packages-linux-arm64 }
    runs-on: ${{ matrix.os }}
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      # The setuid Chromium sandbox needs namespaces that Docker's defaults block.
      options: --privileged
    steps:
      - run: dnf install -y git tar xz procps-ng xorg-x11-server-Xvfb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's setup action needs Node.js, which the bare Fedora image lacks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: packages
      - name: Install RPM
        run: dnf install -y ./packages/*.rpm
      - name: Match Fedora's user-namespace policy
        # Fedora allows unprivileged user namespaces, which Chromium's sandbox
        # uses; the Ubuntu runner host restricts them even inside containers.
        run: sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test as an unprivileged user
        # Chromium refuses to run as root, which is the container default.
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- env PATH="$PATH" HOME=/home/tester bash -c '
            pnpm install --frozen-lockfile
            Xvfb :99 -screen 0 1280x1024x24 &
            DISPLAY=:99 YAPYAP_PACKAGED_EXECUTABLE=/opt/YapYap/yapyap pnpm test:smoke'

  windows:
    name: Smoke (${{ matrix.format }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: nsis, arch: x64, os: windows-latest, installer: 'YapYap-*-win-setup.exe' }
          - { format: nsis, arch: arm64, os: windows-11-arm, installer: 'YapYap-*-win-setup.exe' }
          - {
              format: nsis-arm64-only,
              arch: arm64,
              os: windows-11-arm,
              installer: 'YapYap-*-win-arm64-setup.exe',
            }
          - { format: portable, arch: x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-windows
          path: packages
      - name: Install silently (NSIS)
        if: matrix.format != 'portable'
        shell: pwsh
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          $setup = Get-Item "packages\$env:INSTALLER"
          $process = Start-Process -Wait -PassThru -FilePath $setup.FullName -ArgumentList '/S'
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\YapYap"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Out-Host
          $exe = Get-Item "$dir\YapYap.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "YapYap.exe not found in $dir" }
          Write-Host "Installed at $($exe.FullName)"
          "YAPYAP_PACKAGED_EXECUTABLE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Use the portable build
        if: matrix.format == 'portable'
        shell: pwsh
        run: |
          $exe = Get-Item packages\YapYap-*-win-x64-portable.exe
          "YAPYAP_PACKAGED_EXECUTABLE=$($exe.FullName)" >> $env:GITHUB_ENV
      - run: pnpm test:smoke

  macos:
    name: Smoke (dmg-universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-macos
          path: packages
      - name: Mount the DMG
        run: |
          hdiutil attach packages/*.dmg -nobrowse -mountpoint /Volumes/YapYap
          echo "YAPYAP_PACKAGED_EXECUTABLE=/Volumes/YapYap/YapYap.app/Contents/MacOS/YapYap" >> "$GITHUB_ENV"
      - run: pnpm test:smoke
