name: Package smoke tests

on:
  workflow_call:
    inputs:
      scope:
        description: full runs every format and architecture; representative, one package per system (ADR 0007)
        type: string
        default: full

permissions:
  contents: read

jobs:
  linux:
    name: Smoke (${{ matrix.format }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: appimage, arch: x64, os: ubuntu-latest, artifact: packages-linux-x64 }
    runs-on: ${{ matrix.os }}
    steps: &linux-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: packages
      - name: Install DEB
        if: matrix.format == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./packages/*.deb
          echo "YAPYAP_PACKAGED_EXECUTABLE=/opt/YapYap/yapyap" >> "$GITHUB_ENV"
      - name: Prepare AppImage
        if: matrix.format == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64
          chmod +x packages/*.AppImage
          echo "YAPYAP_PACKAGED_EXECUTABLE=$(ls "$PWD"/packages/*.AppImage)" >> "$GITHUB_ENV"
      - name: AppImage explains a restricted sandbox
        if: matrix.format == 'appimage'
        # Ubuntu restricts unprivileged user namespaces by default, which an
        # AppImage needs for Chromium's sandbox: YapYap must explain, not run.
        env:
          YAPYAP_EXPECT_UNSAFE_START: '1'
        run: xvfb-run -a pnpm test:smoke
      - name: Lift the user-namespace restriction
        if: matrix.format == 'appimage'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm test:smoke

  linux-full:
    name: Smoke (${{ matrix.format }}-${{ matrix.arch }})
    if: inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, arch: x64, os: ubuntu-latest, artifact: packages-linux-x64 }
          - { format: deb, arch: arm64, os: ubuntu-24.04-arm, artifact: packages-linux-arm64 }
          - { format: appimage, arch: arm64, os: ubuntu-24.04-arm, artifact: packages-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps: *linux-steps

  flatpak:
    name: Smoke (flatpak-${{ matrix.arch }})
    if: inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-flatpak-${{ matrix.arch }}
          path: packages
      - name: Install the bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive packages/*.flatpak
          # The sandbox only sees the profile directory the test creates, and the
          # test origin has to be passed in explicitly because flatpak run does
          # not forward the environment.
          mkdir -p "$HOME/smoke-tmp"
          cat > "$HOME/yapyap-flatpak" <<'WRAPPER'
          #!/bin/sh
          exec flatpak run --filesystem="$HOME/smoke-tmp" \
            --env=YAPYAP_TEST_WHATSAPP_ORIGIN="$YAPYAP_TEST_WHATSAPP_ORIGIN" \
            org.guita.YapYap "$@"
          WRAPPER
          chmod +x "$HOME/yapyap-flatpak"
          echo "YAPYAP_PACKAGED_EXECUTABLE=$HOME/yapyap-flatpak" >> "$GITHUB_ENV"
          echo "TMPDIR=$HOME/smoke-tmp" >> "$GITHUB_ENV"
      - run: dbus-run-session -- xvfb-run -a pnpm test:smoke

  rpm:
    name: Smoke (rpm-${{ matrix.arch }})
    if: inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-latest, artifact: packages-linux-x64 }
          - { arch: arm64, os: ubuntu-24.04-arm, artifact: packages-linux-arm64 }
    runs-on: ${{ matrix.os }}
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      # The setuid Chromium sandbox needs namespaces that Docker's defaults block.
      options: --privileged
    steps:
      # Fedora's mirrors, especially the openh264 one, sometimes drop downloads.
      - run: dnf install -y --setopt=retries=10 git tar xz procps-ng xorg-x11-server-Xvfb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's setup action needs Node.js, which the bare Fedora image lacks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: packages
      - name: Install RPM
        run: dnf install -y --setopt=retries=10 ./packages/*.rpm
      - name: Match Fedora's user-namespace policy
        # Fedora allows unprivileged user namespaces, which Chromium's sandbox
        # uses; the Ubuntu runner host restricts them even inside containers.
        run: sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test as an unprivileged user
        # Chromium refuses to run as root, which is the container default.
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- env PATH="$PATH" HOME=/home/tester bash -c '
            pnpm install --frozen-lockfile
            Xvfb :99 -screen 0 1280x1024x24 &
            DISPLAY=:99 YAPYAP_PACKAGED_EXECUTABLE=/opt/YapYap/yapyap pnpm test:smoke'

  aur:
    name: Smoke (aur-x86_64)
    if: inputs.scope == 'full'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:0ccc8b2e55c0c26a6e501e892cc6b1cdea7cfdf77e432941320148b4dabd2bff
      # The setuid Chromium sandbox needs namespaces that Docker's defaults block.
      options: --privileged
    steps:
      - run: pacman -Syu --noconfirm --needed git namcap xorg-server-xvfb alsa-lib gtk3 libsecret nss xdg-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-linux-*
          merge-multiple: true
          path: packages
      - name: Generate the PKGBUILD from this build's packages
        # makepkg uses files already present under their source names, so the
        # PKGBUILD a release would publish is built from these packages instead
        # of downloading a release.
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          mkdir aur
          cp packages/*.deb aur/
          cp LICENSE "aur/yapyap-$version-LICENSE"
          node scripts/src/bin/aur.ts "$version" aur/*-amd64.deb aur/*-arm64.deb aur
      - name: Check the PKGBUILD with makepkg and namcap
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd aur
          runuser -u builder -- makepkg --printsrcinfo | diff -u .SRCINFO -
          namcap PKGBUILD
      - name: Build and install the package
        working-directory: aur
        run: |
          runuser -u builder -- makepkg --noconfirm
          pacman -U --noconfirm yapyap-bin-*.pkg.tar.zst
      - name: Match Arch's user-namespace policy
        # Arch allows unprivileged user namespaces, which Chromium's sandbox
        # uses; the Ubuntu runner host restricts them even inside containers.
        run: sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test as an unprivileged user
        # Chromium refuses to run as root, which is the container default.
        run: |
          runuser -u builder -- env PATH="$PATH" HOME=/home/builder bash -c '
            pnpm install --frozen-lockfile
            Xvfb :99 -screen 0 1280x1024x24 &
            DISPLAY=:99 YAPYAP_PACKAGED_EXECUTABLE=/usr/bin/yapyap pnpm test:smoke'

  windows:
    name: Smoke (${{ matrix.format }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: nsis, arch: x64, os: windows-latest, installer: 'YapYap-*-win-setup.exe' }
    runs-on: ${{ matrix.os }}
    steps: &windows-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-windows
          path: packages
      - name: Install silently (NSIS)
        if: matrix.format != 'portable'
        shell: pwsh
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          $setup = Get-Item "packages\$env:INSTALLER"
          $process = Start-Process -Wait -PassThru -FilePath $setup.FullName -ArgumentList '/S'
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\YapYap"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Out-Host
          $exe = Get-Item "$dir\YapYap.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "YapYap.exe not found in $dir" }
          Write-Host "Installed at $($exe.FullName)"
          "YAPYAP_PACKAGED_EXECUTABLE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Use the portable build
        if: matrix.format == 'portable'
        shell: pwsh
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          $exe = Get-Item "packages\$env:INSTALLER"
          "YAPYAP_PACKAGED_EXECUTABLE=$($exe.FullName)" >> $env:GITHUB_ENV
      - run: pnpm test:smoke

  windows-full:
    name: Smoke (${{ matrix.format }}-${{ matrix.arch }})
    if: inputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: nsis, arch: arm64, os: windows-11-arm, installer: 'YapYap-*-win-setup.exe' }
          - {
              format: nsis-only,
              arch: arm64,
              os: windows-11-arm,
              installer: 'YapYap-*-win-arm64-setup.exe',
            }
          - {
              format: portable,
              arch: x64,
              os: windows-latest,
              installer: 'YapYap-*-win-x64-portable.exe',
            }
          - {
              format: portable,
              arch: arm64,
              os: windows-11-arm,
              installer: 'YapYap-*-win-arm64-portable.exe',
            }
    runs-on: ${{ matrix.os }}
    steps: *windows-steps

  macos:
    name: Smoke (dmg-universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-macos
          path: packages
      - name: Mount the DMG
        run: |
          hdiutil attach packages/*.dmg -nobrowse -mountpoint /Volumes/YapYap
          echo "YAPYAP_PACKAGED_EXECUTABLE=/Volumes/YapYap/YapYap.app/Contents/MacOS/YapYap" >> "$GITHUB_ENV"
      - run: pnpm test:smoke
