name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

# Two pushes in a row must not publish the same release's assets twice at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    # Paused until the first release is near: every update of the release PR
    # runs the full check suite and holds runners that feature PRs wait for.
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A short-lived token from the YapYap automation GitHub App, so bot PRs
      # trigger CI (the workflow token's PRs never do; see CONTRIBUTING).
      - name: Mint the automation token
        id: app-token
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: yapyap
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please lists a change for its commit and again for its merge
      # commit, which carries the PR's Conventional Commit title (#358).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.pr != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.pr != ''
        with:
          node-version-file: .nvmrc
      - name: List each change once in the release PR
        if: steps.release.outputs.pr != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: node scripts/src/bin/merge-changelog.ts

  package:
    name: Package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      release: true
    secrets: inherit

  smoke:
    name: Smoke
    needs: package
    uses: ./.github/workflows/smoke.yml

  publish:
    name: Publish
    needs: [release-please, smoke]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  repository:
    name: Package repositories
    needs: publish
    uses: ./.github/workflows/repository.yml
    secrets: inherit

  aur:
    name: Publish to the AUR
    needs: [release-please, publish]
    if: needs.publish.outputs.aur == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Push yapyap-bin
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_KEY is missing: the PKGBUILD is attached to the release but not published to the AUR (see CONTRIBUTING)."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Trust only the host key whose fingerprint the AUR publishes.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/yapyap-bin.git "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p yapyap-bin.PKGBUILD -p yapyap-bin.SRCINFO
          mv yapyap-bin.PKGBUILD PKGBUILD
          mv yapyap-bin.SRCINFO .SRCINFO
          git add PKGBUILD .SRCINFO
          git -c user.name='Vasco Guita' -c user.email='vascoguita@users.noreply.github.com' \
            commit -m "Update to ${TAG#v}"
          git push origin HEAD:master
