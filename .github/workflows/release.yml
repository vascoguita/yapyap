name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

# Two pushes in a row must not publish the same release's assets twice at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Release PRs opened with the workflow token do not trigger CI, so the
          # required checks would never report; see CONTRIBUTING.
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      release: true
    secrets: inherit

  smoke:
    name: Smoke
    needs: package
    uses: ./.github/workflows/smoke.yml

  publish:
    name: Publish release assets
    needs: [release-please, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/dist/yapyap-${{ needs.release-please.outputs.tag_name }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum -- * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ runner.temp }}/dist
        run: gh release upload "$TAG" "$DIST"/* --clobber --repo "$GITHUB_REPOSITORY"
