name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

# Two pushes in a row must not publish the same release's assets twice at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Release PRs opened with the workflow token do not trigger CI, so the
          # required checks would never report; see CONTRIBUTING.
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      release: true
    secrets: inherit

  smoke:
    name: Smoke
    needs: package
    uses: ./.github/workflows/smoke.yml

  publish:
    name: Publish release assets
    needs: [release-please, smoke]
    runs-on: ubuntu-latest
    outputs:
      aur: ${{ steps.aur.outputs.generated }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate the AUR package files
        id: aur
        env:
          DIST: ${{ runner.temp }}/dist
        run: |
          version="${TAG#v}"
          # makepkg versions cannot contain '-', so pre-releases skip the AUR.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$version is a pre-release, so it is not packaged for the AUR."
            exit 0
          fi
          mkdir "$RUNNER_TEMP/aur"
          node scripts/src/bin/aur.ts "$version" "$DIST"/*-amd64.deb "$DIST"/*-arm64.deb "$RUNNER_TEMP/aur"
          # The checksum and upload globs skip dotfiles, so both files get a prefix.
          cp "$RUNNER_TEMP/aur/PKGBUILD" "$DIST/yapyap-bin.PKGBUILD"
          cp "$RUNNER_TEMP/aur/.SRCINFO" "$DIST/yapyap-bin.SRCINFO"
          echo "generated=true" >> "$GITHUB_OUTPUT"
      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/dist/yapyap-${{ needs.release-please.outputs.tag_name }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum -- * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ runner.temp }}/dist
        run: gh release upload "$TAG" "$DIST"/* --clobber --repo "$GITHUB_REPOSITORY"

  aur:
    name: Publish to the AUR
    needs: [release-please, publish]
    if: needs.publish.outputs.aur == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Push yapyap-bin
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_KEY is missing: the PKGBUILD is attached to the release but not published to the AUR (see CONTRIBUTING)."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Trust only the host key whose fingerprint the AUR publishes.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/yapyap-bin.git "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p yapyap-bin.PKGBUILD -p yapyap-bin.SRCINFO
          mv yapyap-bin.PKGBUILD PKGBUILD
          mv yapyap-bin.SRCINFO .SRCINFO
          git add PKGBUILD .SRCINFO
          git -c user.name='Vasco Guita' -c user.email='vascoguita@users.noreply.github.com' \
            commit -m "Update to ${TAG#v}"
          git push origin HEAD:master
