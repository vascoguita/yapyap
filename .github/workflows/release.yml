name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

# Two pushes in a row must not publish the same release's assets twice at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    # Paused until the first release is near: every update of the release PR
    # runs the full check suite and holds runners that feature PRs wait for.
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Each first-party extension has releases of its own (ADR 0014).
      extensions: ${{ steps.extensions.outputs.paths }}
      # So does each package published to npm (#477).
      packages: ${{ steps.extensions.outputs.packages }}
      outputs: ${{ toJSON(steps.release.outputs) }}
    steps:
      # A short-lived token from the YapYap automation GitHub App, so bot PRs
      # trigger CI (the workflow token's PRs never do; see CONTRIBUTING).
      - name: Mint the automation token
        id: app-token
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: yapyap
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: List the extensions and npm packages released
        id: extensions
        env:
          RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        run: |
          echo "paths=$(jq -c '[.[] | select(startswith("extensions/"))]' <<< "$RELEASED")" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -c '[.[] | select(startswith("packages/"))]' <<< "$RELEASED")" >> "$GITHUB_OUTPUT"
      # release-please lists a change for its commit and again for its merge
      # commit, which carries the PR's Conventional Commit title (#358).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.release_created != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.release_created != 'true'
        with:
          node-version-file: .nvmrc
      - name: List each change once in the release PR
        if: steps.release.outputs.release_created != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: node scripts/src/bin/merge-changelog.ts

  extension:
    name: Publish ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.extensions != '' && needs.release-please.outputs.extensions != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.extensions) }}
    env:
      TAG: ${{ fromJSON(needs.release-please.outputs.outputs)[format('{0}--tag_name', matrix.path)] }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the extension
        env:
          EXTENSION: ${{ matrix.path }}
        run: pnpm --filter "./$EXTENSION" build
      # Only YapYap's key may sign extensions under its own ID (ADR 0004); only
      # this extension is built, so only it is signed. The key is never printed.
      - name: Sign and pack it
        env:
          EXTENSION_SIGNING_KEY: ${{ secrets.EXTENSION_SIGNING_KEY }}
        run: node scripts/src/bin/sign-extensions.ts
      - name: Attach it to its release
        run: gh release upload "$TAG" extensions-out/*.yapyap-extension --repo "$GITHUB_REPOSITORY"
      # The marketplace lists a version only once the maintainer merges this
      # PR, which is the review; merging signs the index again (ADR 0014).
      - name: List it in the marketplace
        env:
          EXTENSION: ${{ matrix.path }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          archive=$(ls extensions-out/*.yapyap-extension)
          entry=$(node scripts/src/bin/marketplace-release.ts "$EXTENSION" "$archive" "$TAG" "$RUNNER_TEMP/notes.md")
          echo "ENTRY=$entry" >> "$GITHUB_ENV"
      - name: Mint the automation token
        id: app-token
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: yapyap
          permission-contents: write
          permission-pull-requests: write
      # Through the API, so GitHub signs the commit, and with the automation
      # token, so the PR's checks run (see CONTRIBUTING).
      - name: Open the marketplace PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          branch="marketplace/$TAG"
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          existing=$(gh api "repos/$GITHUB_REPOSITORY/contents/$ENTRY?ref=$branch" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$ENTRY" \
            -f message="chore(marketplace): list $TAG" -f branch="$branch" \
            -f content="$(base64 -w0 "$ENTRY")" ${existing:+-f sha="$existing"} >/dev/null
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" \
            --title "chore(marketplace): list $TAG" \
            --body "Lists the signed archive attached to the $TAG release in the marketplace. Merging this PR is the review: the index is signed again with this version in it (ADR 0014)."

  npm:
    name: Publish ${{ matrix.path }} to npm
    needs: release-please
    # Only this repository's release workflow publishes, so the provenance
    # names this workflow and this repository as the package's builder.
    if: >-
      github.repository == 'vascoguita/yapyap' &&
      needs.release-please.outputs.packages != '' && needs.release-please.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.packages) }}
    env:
      TAG: ${{ fromJSON(needs.release-please.outputs.outputs)[format('{0}--tag_name', matrix.path)] }}
    steps:
      - name: Check how npm publishing is set up
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED_PUBLISHING" = 'true' ] || [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Neither NPM_TRUSTED_PUBLISHING nor NPM_TOKEN is set: $TAG is released on GitHub but not published to npm (see CONTRIBUTING)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.npm.outputs.configured == 'true'
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.npm.outputs.configured == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.npm.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.npm.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      # pnpm packs the manifest as published: compiled exports and bin from
      # publishConfig, and the repository's LICENSE.
      - name: Build and pack it
        if: steps.npm.outputs.configured == 'true'
        env:
          PACKAGE: ${{ matrix.path }}
        run: |
          pnpm --filter "./$PACKAGE" build
          cd "$PACKAGE"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      # Trusted publishing needs npm 11.5.1 or later, newer than Node.js
      # bundles; the token, when used, is read from the environment and never
      # written to disk. A re-run skips a version npm already has.
      - name: Publish it with provenance
        if: steps.npm.outputs.configured == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ matrix.path }}
        run: |
          npm install --global --ignore-scripts npm@12.2.1
          if [ -n "$NPM_TOKEN" ]; then
            cat > "$RUNNER_TEMP/npmrc" << 'NPMRC'
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          NPMRC
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          fi
          spec=$(node -p "const p = require('./$PACKAGE/package.json'); p.name + '@' + p.version")
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::notice::$spec is already on npm."
            exit 0
          fi
          npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public

  package:
    name: Package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      release: true
    secrets: inherit

  smoke:
    name: Smoke
    needs: package
    uses: ./.github/workflows/smoke.yml

  publish:
    name: Publish
    needs: [release-please, smoke]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  repository:
    name: Package repositories
    needs: publish
    uses: ./.github/workflows/repository.yml
    secrets: inherit

  distribute:
    name: Distribute
    needs: [release-please, publish]
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  aur:
    name: Publish to the AUR
    needs: [release-please, publish]
    if: needs.publish.outputs.aur == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Push yapyap-bin
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_KEY is missing: the PKGBUILD is attached to the release but not published to the AUR (see CONTRIBUTING)."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Trust only the host key whose fingerprint the AUR publishes.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/yapyap-bin.git "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p yapyap-bin.PKGBUILD -p yapyap-bin.SRCINFO
          mv yapyap-bin.PKGBUILD PKGBUILD
          mv yapyap-bin.SRCINFO .SRCINFO
          git add PKGBUILD .SRCINFO
          git -c user.name='Vasco Guita' -c user.email='vascoguita@users.noreply.github.com' \
            commit -m "Update to ${TAG#v}"
          git push origin HEAD:master
