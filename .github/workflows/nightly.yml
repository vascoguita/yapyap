name: Nightly

on:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:
  # A PR that changes the benchmark or its budgets measures them before merge.
  pull_request:
    paths:
      - apps/desktop/e2e/bench/**
      - .github/workflows/nightly.yml

permissions:
  contents: read

jobs:
  mutation:
    name: Full mutation run
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/mutation.yml
    with:
      all: true

  benchmark:
    name: Benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Benchmark (Linux, virtual display)
        if: runner.os == 'Linux'
        # The sandbox needs unprivileged user namespaces, which Ubuntu restricts.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a pnpm test:bench
      - name: Benchmark
        if: runner.os != 'Linux'
        run: pnpm test:bench
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.os }}
          path: apps/desktop/test-results/
          retention-days: 30
