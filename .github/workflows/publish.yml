name: Publish release assets

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag the assets belong to, such as v0.1.0 or v0.1.0-beta.1
        type: string
        required: true
    outputs:
      aur:
        description: Whether AUR package files were generated (stable releases only)
        value: ${{ jobs.publish.outputs.aur }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    outputs:
      aur: ${{ steps.aur.outputs.generated }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate the AUR package files
        id: aur
        env:
          DIST: ${{ runner.temp }}/dist
        run: |
          version="${TAG#v}"
          # makepkg versions cannot contain '-', so pre-releases skip the AUR.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$version is a pre-release, so it is not packaged for the AUR."
            exit 0
          fi
          mkdir "$RUNNER_TEMP/aur"
          node scripts/src/bin/aur.ts "$version" "$DIST"/*-amd64.deb "$DIST"/*-arm64.deb "$RUNNER_TEMP/aur"
          # The checksum and upload globs skip dotfiles, so both files get a prefix.
          cp "$RUNNER_TEMP/aur/PKGBUILD" "$DIST/yapyap-bin.PKGBUILD"
          cp "$RUNNER_TEMP/aur/.SRCINFO" "$DIST/yapyap-bin.SRCINFO"
          echo "generated=true" >> "$GITHUB_OUTPUT"
      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/dist/yapyap-${{ inputs.tag }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum -- * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ runner.temp }}/dist
        run: gh release upload "$TAG" "$DIST"/* --clobber --repo "$GITHUB_REPOSITORY"
