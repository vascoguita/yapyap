name: Set up pnpm and Node.js
description: Installs pnpm and the Node.js version in .nvmrc, then the workspace's dependencies.

inputs:
  cache:
    description: Restore and save pnpm's store with setup-node's cache
    default: 'true'
  install:
    description: Run pnpm install --frozen-lockfile
    default: 'true'

runs:
  using: composite
  steps:
    # setup-node finds the store to cache through pnpm, so pnpm comes first
    # with the cache. Without it, Node.js comes first: bare container images,
    # such as Fedora's, have no Node.js for pnpm's own setup to run on.
    - if: inputs.cache == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - if: inputs.cache != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
