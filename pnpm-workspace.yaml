packages:
  - apps/*
  - packages/*
  - plugins/*
  - docs
  - scripts

# Dependency install scripts are denied unless listed here with a justification
# in the PR that adds them.
allowBuilds:
  # VitePress pulls in esbuild, whose binary arrives as an optional platform
  # package; its postinstall only re-verifies it, so the script stays denied.
  esbuild: false
