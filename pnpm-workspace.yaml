packages:
  - apps/*
  - packages/*
  - extensions/*
  - docs
  - scripts

# Dependency install scripts are denied unless listed here with a justification
# in the PR that adds them.
allowBuilds:
  # VitePress pulls in esbuild, whose binary arrives as an optional platform
  # package; its postinstall only re-verifies it, so the script stays denied.
  esbuild: false
  # Only needed for Squirrel.Windows, which YapYap does not build (NSIS instead).
  electron-winstaller: false

overrides:
  # VitePress 1.6.4 (latest stable) still pins Vite 5, which has unpatched
  # advisories; Vite 6.4.5 is the patched line its Vue extension supports.
  vitepress>vite: 6.4.5
  # Stryker's REST client pulls in a qs release with denial-of-service advisories.
  qs@<6.16.0: 6.16.1
  # electron-builder's Electron downloader still uses global-agent 3, whose
  # logger depends on sprintf-js, which has an unpatched denial-of-service
  # advisory. global-agent 4 keeps the same bootstrap() API without it.
  global-agent@3: 4.1.3
