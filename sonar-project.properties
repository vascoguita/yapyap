# SonarQube Cloud analysis (see docs/adr/0005-test-strategy.md). The scanner
# already skips everything .gitignore lists, such as builds and reports.
sonar.organization=github-vascoguita
sonar.projectKey=vascoguita_yapyap
sonar.projectName=YapYap

sonar.sources=.
sonar.tests=.
# Tests, end-to-end specs and the fake WhatsApp page are test code: analyzed
# with test rules, kept out of duplication and coverage.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/e2e/**,apps/desktop/test/**,test/**,vitest.mutation.setup.ts
sonar.exclusions=**/node_modules/**,pnpm-lock.yaml,**/*.test.ts,**/*.test.tsx,**/e2e/**,apps/desktop/test/**,test/**,vitest.mutation.setup.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The same exclusions as vitest.config.ts: config files and entry points that
# only wire real Electron or Node APIs together (ADR 0005).
sonar.coverage.exclusions=**/*.config.ts,**/*.config.js,**/*.config.mjs,vitest.mutation.config.ts,vitest.projects.ts,docs/.vitepress/**,apps/desktop/src/main/index.ts,apps/desktop/src/preload/*/index.ts,scripts/src/bin/**,packages/*/src/bin/**

# Narrow exceptions, each with its reason (ADR 0010).
sonar.issue.ignore.multicriteria=bins-console,bins-path,entry-await,e2e-assertions,e2e-skips
# Command-line entry points exist to print their results.
sonar.issue.ignore.multicriteria.bins-console.ruleKey=typescript:S106
sonar.issue.ignore.multicriteria.bins-console.resourceKey=scripts/src/bin/**
# Developer and CI scripts run pnpm and git from the caller's PATH on purpose;
# nothing they run ships to users.
sonar.issue.ignore.multicriteria.bins-path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.bins-path.resourceKey=scripts/src/bin/**
# Top-level await in the main entry holds back Electron's ready event under
# Playwright, and entry files must stay branch-free (CLAUDE.md).
sonar.issue.ignore.multicriteria.entry-await.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.entry-await.resourceKey=apps/desktop/src/main/index.ts
# The analyzer does not recognize Playwright's expect when fixtures.ts
# re-exports it, nor expect.poll, so asserting E2E tests read as empty.
sonar.issue.ignore.multicriteria.e2e-assertions.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e2e-assertions.resourceKey=apps/desktop/e2e/**
# Playwright's conditional test.skip(condition, reason) always carries its
# reason, which the analyzer does not read.
sonar.issue.ignore.multicriteria.e2e-skips.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.e2e-skips.resourceKey=apps/desktop/e2e/**
